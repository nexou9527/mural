name: iOS
on:
  push:
    branches: [main]
    paths: ['apps/ios/**', 'scripts/generate_project.py', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/ios/**', 'scripts/generate_project.py', '.github/workflows/ios.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report toolchain version
        run: xcodebuild -version
      - name: Resolve Swift package dependencies
        working-directory: apps/ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Mural.xcodeproj \
            -scheme Mural
      - name: Archive without code signing
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project Mural.xcodeproj \
            -scheme Mural \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mural.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Mural.xcarchive/Products/Applications/Mural.app"
          test -d "$APP"
          STAGE="$RUNNER_TEMP/ipa"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          echo "--- embedded Info.plist ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STAGE/Payload/Mural.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$STAGE/Payload/Mural.app/Info.plist"
          echo "--- code signature state ---"
          codesign -dv "$STAGE/Payload/Mural.app" 2>&1 || true
          (cd "$STAGE" && zip -qry "$RUNNER_TEMP/Mural-unsigned.ipa" Payload)
          shasum -a 256 "$RUNNER_TEMP/Mural-unsigned.ipa"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mural-ios-unsigned-ipa
          path: ${{ runner.temp }}/Mural-unsigned.ipa
          retention-days: 14
